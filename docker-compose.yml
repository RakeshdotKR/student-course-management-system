#version: "3.8"

services:
  # MySQL database container
  mysql-db:
    image: mysql:8.0
    container_name: scms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: scms_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # Spring Boot backend container
  backend:
    build: .
    container_name: scms-backend
    restart: always
    depends_on:
      - mysql-db
    ports:
      - "8081:8081"

volumes:
    mysql-data:
 