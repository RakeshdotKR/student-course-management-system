# Docker-specific profile - used when the app runs inside a container.
# Key difference: DB host is the Docker Compose service name, not localhost.

spring.application.name=scms

spring.datasource.url=jdbc:mysql://mysql-db:3306/scms_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
